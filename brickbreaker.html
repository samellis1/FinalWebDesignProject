<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick Breaker | Sam Ellis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@200;400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background: #1b1f2a;
    font-family: "Libre Franklin", "Segoe UI", Arial, sans-serif;
    font-weight: 400;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 { color: #ffffff; margin: 1.2rem 0 0.3rem 0; font-weight: 200; letter-spacing: 1px; }
  .hud {
    display: flex;
    gap: 2rem;
    font-size: 1rem;
    margin: 0.4rem 0;
  }
  .hud span b { color: #5ec8ff; }
  canvas {
    background: #11141c;
    border: 3px solid #2c3242;
    border-radius: 8px;
    touch-action: none;
    max-width: 96vw;
  }
  .controls { font-size: 0.8rem; color: #9aa3b2; margin: 0.6rem 1rem; text-align: center; }
  .nav-links { margin-bottom: 1.5rem; }
  .nav-links a { color: #5ec8ff; margin: 0 0.6rem; }
</style>
</head>
<body>
  <h1>Brick Breaker</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Lives: <b id="lives">3</b></span>
    <span>Level: <b id="level">1</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <canvas id="game" width="720" height="520"></canvas>
  <p class="controls">
    Move the paddle with your mouse, the &larr; &rarr; keys, or touch &middot;
    Click, tap, or press space to launch and pause
  </p>
  <div class="nav-links">
    <a href="scratch.html">&larr; Back to In the Water</a>
    <a href="index.html">Home</a>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const levelEl = document.getElementById('level');
  const bestEl = document.getElementById('best');

  // Simple color per brick row
  const ROW_COLORS = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#b197fc'];

  let state;

  function freshState() {
    return {
      score: 0, lives: 3, level: 1,
      mode: 'ready',            // ready | play | paused | over | win
      paddle: { w: 110, x: W / 2 - 55, h: 14 },
      balls: [],
      bricks: [],
    };
  }

  function newBall(stuck = true) {
    return { x: W / 2, y: H - 60, r: 8, dx: 0, dy: 0, speed: 5 + state.level * 0.35, stuck };
  }

  function buildLevel(n) {
    const bricks = [];
    const cols = 10, rows = Math.min(3 + n, 6);
    const bw = (W - 60) / cols, bh = 22;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        bricks.push({
          x: 30 + c * bw, y: 60 + r * (bh + 6), w: bw - 4, h: bh,
          color: ROW_COLORS[r % ROW_COLORS.length],
          hits: 1,
        });
      }
    }
    return bricks;
  }

  function startLevel() {
    state.bricks = buildLevel(state.level);
    state.balls = [newBall(true)];
    state.mode = 'ready';
  }

  function launch() {
    for (const b of state.balls) {
      if (b.stuck) {
        b.stuck = false;
        const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
        b.dx = Math.cos(angle) * b.speed;
        b.dy = Math.sin(angle) * b.speed;
      }
    }
    state.mode = 'play';
  }

  // ---- input ----
  let leftDown = false, rightDown = false;

  function movePaddleTo(px) {
    state.paddle.x = Math.max(0, Math.min(W - state.paddle.w, px - state.paddle.w / 2));
  }

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    movePaddleTo((e.clientX - rect.left) * (W / rect.width));
  });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    movePaddleTo((e.touches[0].clientX - rect.left) * (W / rect.width));
  }, { passive: false });

  function primaryAction() {
    if (state.mode === 'over' || state.mode === 'win') { state = freshState(); startLevel(); }
    else if (state.mode === 'ready') launch();
    else if (state.mode === 'play') state.mode = 'paused';
    else if (state.mode === 'paused') state.mode = 'play';
    syncHud();
  }
  canvas.addEventListener('click', primaryAction);
  canvas.addEventListener('touchstart', e => {
    const rect = canvas.getBoundingClientRect();
    movePaddleTo((e.touches[0].clientX - rect.left) * (W / rect.width));
    if (state.mode !== 'play') primaryAction();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') leftDown = true;
    if (e.key === 'ArrowRight') rightDown = true;
    if (e.key === ' ') { e.preventDefault(); primaryAction(); }
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') leftDown = false;
    if (e.key === 'ArrowRight') rightDown = false;
  });

  // ---- update ----
  function update() {
    if (leftDown) state.paddle.x = Math.max(0, state.paddle.x - 9);
    if (rightDown) state.paddle.x = Math.min(W - state.paddle.w, state.paddle.x + 9);

    if (state.mode !== 'play') return;

    for (const ball of state.balls) {
      if (ball.stuck) { ball.x = state.paddle.x + state.paddle.w / 2; ball.y = H - 60; continue; }
      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.x < ball.r) { ball.x = ball.r; ball.dx *= -1; }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.dx *= -1; }
      if (ball.y < ball.r) { ball.y = ball.r; ball.dy *= -1; }

      // paddle bounce, angle depends on hit position
      const p = state.paddle;
      if (ball.dy > 0 && ball.y + ball.r >= H - 26 && ball.y + ball.r <= H - 8 &&
          ball.x >= p.x - ball.r && ball.x <= p.x + p.w + ball.r) {
        const rel = (ball.x - (p.x + p.w / 2)) / (p.w / 2);
        const ang = -Math.PI / 2 + rel * (Math.PI / 3);
        const speed = Math.hypot(ball.dx, ball.dy);
        ball.dx = Math.cos(ang) * speed;
        ball.dy = Math.sin(ang) * speed;
        ball.y = H - 26 - ball.r;
      }

      // brick collisions
      for (const brick of state.bricks) {
        if (brick.hits <= 0) continue;
        if (ball.x + ball.r > brick.x && ball.x - ball.r < brick.x + brick.w &&
            ball.y + ball.r > brick.y && ball.y - ball.r < brick.y + brick.h) {
          const overlapX = Math.min(ball.x + ball.r - brick.x, brick.x + brick.w - (ball.x - ball.r));
          const overlapY = Math.min(ball.y + ball.r - brick.y, brick.y + brick.h - (ball.y - ball.r));
          if (overlapX < overlapY) ball.dx *= -1; else ball.dy *= -1;
          brick.hits--;
          state.score += 10 * state.level;
          break;
        }
      }
    }

    // remove balls that fell off the bottom
    state.balls = state.balls.filter(b => b.y - b.r < H);
    if (state.balls.length === 0) {
      state.lives--;
      if (state.lives <= 0) {
        state.mode = 'over';
        saveBest();
      } else {
        state.balls = [newBall(true)];
        state.mode = 'ready';
      }
    }

    // level cleared
    if (state.bricks.every(b => b.hits <= 0)) {
      state.score += 100 * state.level;
      if (state.level >= 6) {
        state.mode = 'win';
        saveBest();
      } else {
        state.level++;
        startLevel();
      }
    }

    syncHud();
  }

  // ---- render ----
  function centerText(lines) {
    ctx.save();
    ctx.fillStyle = 'rgba(17, 20, 28, 0.85)';
    ctx.fillRect(W / 2 - 250, H / 2 - 90, 500, 180);
    ctx.strokeStyle = '#5ec8ff';
    ctx.strokeRect(W / 2 - 250, H / 2 - 90, 500, 180);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#5ec8ff';
    ctx.font = '600 30px "Libre Franklin", Arial, sans-serif';
    ctx.fillText(lines[0], W / 2, H / 2 - 30);
    ctx.fillStyle = '#f0f0f0';
    ctx.font = '400 16px "Libre Franklin", Arial, sans-serif';
    lines.slice(1).forEach((t, i) => ctx.fillText(t, W / 2, H / 2 + 10 + i * 28));
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    for (const brick of state.bricks) {
      if (brick.hits <= 0) continue;
      ctx.fillStyle = brick.color;
      ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
    }

    // paddle
    const p = state.paddle;
    ctx.fillStyle = '#e9ecef';
    ctx.beginPath();
    ctx.roundRect(p.x, H - 26, p.w, p.h, 7);
    ctx.fill();

    // balls
    for (const ball of state.balls) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    }

    if (state.mode === 'ready') centerText(['Level ' + state.level, 'Click, tap, or press space to launch']);
    if (state.mode === 'paused') centerText(['Paused', 'Click, tap, or press space to resume']);
    if (state.mode === 'over') centerText(['Game Over', 'Final score: ' + state.score, 'Click, tap, or press space to play again']);
    if (state.mode === 'win') centerText(['You Win!', 'You cleared all 6 levels. Score: ' + state.score, 'Click, tap, or press space to play again']);
  }

  function syncHud() {
    scoreEl.textContent = state.score;
    livesEl.textContent = state.lives;
    levelEl.textContent = state.level;
    bestEl.textContent = localStorage.getItem('brickBreakerBest') || 0;
  }

  function saveBest() {
    const best = Number(localStorage.getItem('brickBreakerBest') || 0);
    if (state.score > best) localStorage.setItem('brickBreakerBest', state.score);
    syncHud();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  state = freshState();
  startLevel();
  syncHud();
  loop();
})();
</script>
</body>
</html>
